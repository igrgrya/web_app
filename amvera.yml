---
# Конфигурация публикации лабораторной №3 на Amvera Cloud.
# Формат по официальной статье Amvera о деплое FastAPI:
# https://habr.com/ru/companies/amvera/articles/833588
# Важно: containerPort и порт в command должны совпадать.
meta:
  environment: python
  toolchain:
    name: pip
    version: "3.12"
  build:
    requirementsPath: backend/requirements.txt
  run:
    persistenceMount: /data
    containerPort: 8000
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
